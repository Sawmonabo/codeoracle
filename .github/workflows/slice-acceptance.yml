name: slice-acceptance

on:
  pull_request:
    paths:
    - src/**
    - tests/integration/slice/**
    - infra/compose/**
    - infra/docker/**
    - infra/observability/**
    - scripts/**
    - .github/workflows/slice-acceptance.yml
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

env:
  UV_PYTHON: '3.14'

jobs:
  architectural-invariants:
    uses: ./.github/workflows/ci.yml

  slice-stack:
    name: Slice E2E stack + observability gates
    runs-on: ubuntu-latest
    needs: architectural-invariants
    timeout-minutes: 30
    env:
      CODEORACLE_DB__HOST: localhost
      CODEORACLE_DB__PORT: '5432'
      CODEORACLE_DB__USER: codeoracle
      CODEORACLE_DB__PASSWORD: codeoracle
      CODEORACLE_DB__DATABASE: codeoracle
      CODEORACLE_TRACES__TEMPO_URL: http://localhost:3200
    steps:
    - uses: actions/checkout@v6.0.3

    - name: Install uv
      uses: astral-sh/setup-uv@v8.2.0
      with:
        version: 0.11.21
        enable-cache: true
        cache-dependency-glob: uv.lock

    - name: Sync dependencies
      run: uv sync --frozen

    - name: Build and start stack
      run: |
        docker compose --env-file infra/versions/pinned.env \
          -f infra/compose/docker-compose.yml \
          -f infra/compose/docker-compose.e2e.yml \
          up -d --build

    - name: Wait for API and MCP health
      run: |
        set -euo pipefail
        for _ in $(seq 1 90); do
          if curl -fsS http://127.0.0.1:8080/v1/health >/dev/null \
            && curl -fsS -X POST -H 'Content-Type: application/json' \
              --data '{"jsonrpc":"2.0","id":0,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"healthcheck","version":"0"}}}' \
              http://127.0.0.1:8082/mcp >/dev/null; then
            echo "Stack healthy."
            exit 0
          fi
          sleep 2
        done
        docker compose -f infra/compose/docker-compose.yml \
          -f infra/compose/docker-compose.e2e.yml logs --tail=200
        exit 1

    - name: Run slice integration tests
      run: uv run pytest tests/integration/slice/ -v -m slice

    - name: Assert required child spans are present
      run: |
        uv run python scripts/assert_slice_spans.py \
          --required intent.parse,graph.query,embed.query,llm.compose,verifier.verify

    - name: Assert self traces were ingested
      run: uv run python scripts/assert_self_traces_ingested.py

    - name: Assert verifier resolution logs exist
      run: |
        docker compose -f infra/compose/docker-compose.yml \
          -f infra/compose/docker-compose.e2e.yml logs api | \
          grep -c '"event":"verifier.citation_' | \
          awk '{if($1<1){print "FAIL"; exit 1} else {print "OK ("$1" log lines)"}}'

    - name: Post performance summary
      if: github.event_name == 'pull_request' && hashFiles('perf-report.json') != ''
      run: |
        uv run python scripts/post_perf_comment.py \
          --report perf-report.json \
          --pr ${{ github.event.pull_request.number }}

    - name: Upload perf-report.json
      if: always()
      uses: actions/upload-artifact@v7.0.1
      with:
        name: perf-report
        path: perf-report.json
        if-no-files-found: ignore

    - name: Tear down stack
      if: always()
      run: |
        docker compose -f infra/compose/docker-compose.yml \
          -f infra/compose/docker-compose.e2e.yml down -v
